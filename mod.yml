title: KH1FM Dual Styles Prototype v13
originalAuthor: JamesPMx / PM2CRAZY; isolated derivative by OpenAI Codex
description: >-
  Renames the abilities to Style: Dual A and Style: Dual B. Dual A retains
  Valor. Dual B uses Final basic ground/air combos, Master aerial dodge in
  place of Dodge Roll, and the former idle-body Keyblade spin on Guard.
  Duplicate the equipped weapon; exclusive passive styles, native spells
  and attack-ability priority. Requires KH2FM in the same installation.
  Disable older Dual Wield versions and the full KH2 Combat overhaul.
