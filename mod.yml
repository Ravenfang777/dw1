title: KH1FM Dual Styles Prototype v12
originalAuthor: JamesPMx / PM2CRAZY; isolated derivative by OpenAI Codex
description: >-
  Refreshes the Close offhand from its live draw hand during native glides.
  Ranged attacks keep Final idle on Sora with the same spinning weapons
  on ground and air; finite three-slot combos, combo modifiers and air
  hover. Both exclusive styles duplicate the currently equipped weapon.
  Native spells retained; no Aero spell/MP from Attack, Drive system,
  costume or bonus abilities. Requires KH2FM in the same installation.
  Disable older Dual Wield and the full KH2 Combat overhaul.
