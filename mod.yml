title: KH1FM Dual Wield Prototype v4
originalAuthor: JamesPMx / PM2CRAZY; isolated derivative by OpenAI Codex
description: >-
  Passive Dual Wield ability. Duplicates the currently equipped KH1 weapon.
  Valor ground/aerial combos and matching idle, walk, run, jump/rise, fall,
  landing, ledge and available glide animations over native KH1 actions.
  Default KH1 casting; Master casting overrides removed. No Drive gauge,
  drain, recolouring, stat bonuses or additional ability grants.
  Requires KH2FM in the same install. Disable previous Dual Wield versions,
  older offhand scripts, embedded duplicate-model assets and the full KH2 Combat mod.
