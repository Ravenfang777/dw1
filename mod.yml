title: KH1FM Dual Styles Prototype v14
originalAuthor: JamesPMx / PM2CRAZY; isolated derivative by OpenAI Codex
description: >-
  Dual A Superglide uses Valor's aerial-finisher animation over native
  movement. Dual B Guard is a silent stationary blade spin; Dodge Roll
  is a moving version of that spin. Final base combos and KH2 casting
  animations retained. Both styles duplicate the equipped KH1 weapon.
  Requires KH2FM in the same installation. Disable older Dual Wield
  versions and the full KH2 Combat overhaul.
